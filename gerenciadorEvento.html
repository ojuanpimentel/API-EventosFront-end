<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos</title>
    <link rel="stylesheet" href="style.css"> </head>

<body class="main">
    <header>
        <div class="navMaior">
            <nav class="navbar">
                <h1>Gerenciador de Eventos</h1>
                <ul class="nav-links">
                    <li><a href="cadastroPalestrante.html">Cadastro de palestrantes</a></li>
                    <li><a href="cadastroEvento.html">Cadastro de eventos</a></li>
                    <li><a href="gerenciadorEvento.html">Gerenciador de Eventos</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <h2>Eventos</h2>

        <br><br>

        <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>
        <div id="listaEventos" class="cards" aria-live="polite"></div>

    </main>

    <dialog id="dialogEdicao">
        <form id="formEdicao">
            <h2>Editar evento</h2>
            <div class="campo">
                <label for="edicaoNome">Nome:</label>
                <input type="text" id="edicaoNome" required>
            </div>
            <div class="campo">
                <label for="edicaoDescricao">Descrição:</label>
                <input type="text" id="edicaoDescricao" required>
            </div>
            <div class="campo">
                <label for="edicaoLocal">Local:</label>
                <input type="text" id="edicaoLocal" required>
            </div>
            <div class="campo">
                <label for="edicaoData">Data e horário:</label>
                <input type="datetime-local" id="edicaoData" required>
            </div>
            <div class="campo">
                <label for="edicaoPalestrante">Palestrante:</label>
                <select id="edicaoPalestrante" required></select>
            </div>
            <div class="botoes">
                <button type="submit">Salvar</button>
                <button type="button" id="cancelarEdicao">Cancelar</button>
            </div>
        </form>
    </dialog>
    <script src="api.js" defer></script>
    <script src="gerenciadorEvento.js" defer></script>
</body>


</html>
